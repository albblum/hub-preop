services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub_preop
    ports:
      - "5432:5432"
    volumes:
      - hub_preop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub_preop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hub_preop_pg:
